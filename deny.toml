# cargo-deny: Lizenzen und Sicherheitsmeldungen der Abhängigkeiten.
# Nur Lizenzen, die eine spätere Veröffentlichung als Open Source
# (MIT OR Apache-2.0) erlauben (PRD NF-8).

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OFL-1.1",
]
confidence-threshold = 0.9

# Eigene Crates sind in der privaten Phase noch ohne Lizenz.
[licenses.private]
ignore = true

[advisories]
yanked = "deny"
# Nicht mehr gepflegte Crates nur bei direkten Abhängigkeiten melden.
# Indirekte (u. a. bincode, paste, rustybuzz, ttf-parser über Typst und
# Tauri) können wir nicht selbst austauschen; sie werden bei jedem
# Typst-/Tauri-Update erneut geprüft.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.38 über typst-library → hayagriva → citationberg
    # (Literaturverzeichnisse). Betroffen ist nur das Parsen fremder XML-Dateien;
    # CalendarCraft erzeugt den Typst-Quelltext selbst und nutzt keine
    # Literaturverzeichnisse. Entfernen, sobald Typst quick-xml >= 0.41 nutzt.
    { id = "RUSTSEC-2026-0194", reason = "nur über Typst-Bibliografie erreichbar, nicht genutzt" },
    { id = "RUSTSEC-2026-0195", reason = "nur über Typst-Bibliografie erreichbar, nicht genutzt" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
