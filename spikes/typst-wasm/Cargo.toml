[package]
name = "spike-typst-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "spike-typst-wasm"
path = "src/main.rs"

[dependencies]
cc-calendar.workspace = true
typst = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-layout = "0.15"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "Response", "Performance"] }
console_error_panic_hook.workspace = true
