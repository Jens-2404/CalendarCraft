[package]
name = "cc-render"
description = "CalendarCraft: Ausgabe als PDF, SVG und PNG über Typst (ADR-002)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Exakte Version: Typst ändert seine Programmierschnittstelle zwischen Versionen.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
typst-render = { version = "=0.15.1", optional = true }

[features]
default = ["png"]
# PNG-Ausgabe (im Browser nicht nötig)
png = ["dep:typst-render"]
